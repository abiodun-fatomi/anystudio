name: Deploy

# Deployment is driven from here rather than by Render's auto-deploy, so that
# nothing reaches an environment without first passing CI.
#
# development → dev.anystudio.ai      (automatic)
# production  → anystudio.ai          (requires a human approval on the
#                                      `production` GitHub environment)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [development, production]

permissions:
  contents: read

jobs:
  dev:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'development'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://app.dev.anystudio.ai
    steps:
      # Render runs `pnpm db:deploy` as its preDeployCommand before new
      # instances start, so migrations are applied exactly once per deploy.
      - name: Deploy API and worker
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API_DEV }}"
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WORKER_DEV }}"

  production:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'production'
    runs-on: ubuntu-latest
    environment:
      name: production            # add required reviewers here — that is the gate
      url: https://app.anystudio.ai
    steps:
      - name: Deploy API and worker
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API_PROD }}"
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WORKER_PROD }}"
