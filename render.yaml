# Render blueprint — the API, the queue worker and Redis, for all three
# environments. Import it ONCE (Render → New → Blueprint → this repo) and it
# creates nine resources; re-syncing it after an edit updates them.
#
#   development → anystudio-api-dev       anystudio-worker-dev       anystudio-redis-dev
#   staging     → anystudio-api-staging   anystudio-worker-staging   anystudio-redis-staging
#   production  → anystudio-api           anystudio-worker           anystudio-redis
#
# Two services per environment, deployed and scaled independently: provider
# calls in the worker take tens of seconds and must never compete with
# webhook acknowledgements on the API, which have to return fast or the
# sender retries and we process the event twice.
#
# Deploys are NOT triggered by Render (`autoDeploy: false`). The `API`
# GitHub workflow deploys a commit only after it has passed the checks, pins
# that exact commit, and waits for it to be live — see docs/DEPLOY.md §3.
#
# Migrations are the `preDeployCommand`, which Render runs ONCE per deploy,
# in the new image, before any new instance starts. Never in the start
# command — two replicas booting together would both run `migrate deploy`
# against the same database, which is how a schema ends up half-applied.
#
# Secrets are `sync: false`: Render asks for them on first import and keeps
# them in the dashboard. They are never in this file, and the env groups
# below are how the same list is set once per environment rather than once
# per service. The three groups are identical on purpose: what differs
# between environments is the values, and those live in the dashboard.

previewsEnabled: false

envVarGroups:
  - name: anystudio-dev
    envVars:
      - key: APP_KEY                    # openssl rand -base64 32 — encrypts TOTP seeds and the OAuth handshake cookie
        sync: false
      - key: DATABASE_URL               # Supabase: transaction pooler, port 6543
        sync: false
      - key: DIRECT_URL                 # Supabase: direct connection, port 5432 — migrations only
        sync: false
      - key: ORIGIN_APP                 # https://app.dev.anystudio.ai
        sync: false
      - key: ORIGIN_ORG                 # https://org.dev.anystudio.ai
        sync: false
      - key: ORIGIN_ADMIN               # https://admin.dev.anystudio.ai
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM                  # "AnyStudio <hello@anystudio.ai>"
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: HIGGSFIELD_API_KEY
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
  - name: anystudio-staging
    envVars:
      - key: APP_KEY                    # openssl rand -base64 32 — encrypts TOTP seeds and the OAuth handshake cookie
        sync: false
      - key: DATABASE_URL               # Supabase: transaction pooler, port 6543
        sync: false
      - key: DIRECT_URL                 # Supabase: direct connection, port 5432 — migrations only
        sync: false
      - key: ORIGIN_APP                 # https://app.staging.anystudio.ai
        sync: false
      - key: ORIGIN_ORG                 # https://org.staging.anystudio.ai
        sync: false
      - key: ORIGIN_ADMIN               # https://admin.staging.anystudio.ai
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM                  # "AnyStudio <hello@anystudio.ai>"
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: HIGGSFIELD_API_KEY
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
  - name: anystudio-production
    envVars:
      - key: APP_KEY                    # openssl rand -base64 32 — encrypts TOTP seeds and the OAuth handshake cookie
        sync: false
      - key: DATABASE_URL               # Supabase: transaction pooler, port 6543
        sync: false
      - key: DIRECT_URL                 # Supabase: direct connection, port 5432 — migrations only
        sync: false
      - key: ORIGIN_APP                 # https://app.anystudio.ai
        sync: false
      - key: ORIGIN_ORG                 # https://org.anystudio.ai
        sync: false
      - key: ORIGIN_ADMIN               # https://admin.anystudio.ai
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM                  # "AnyStudio <hello@anystudio.ai>"
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: HIGGSFIELD_API_KEY
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
