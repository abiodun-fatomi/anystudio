# Render blueprint — the development environment.
#
# Import it once (Render → New → Blueprint → this repo, branch `development`)
# and it creates five billable things: the API, two purpose-built workers,
# Postgres and the Redis (Key Value) the queue rides on.
#
#   anystudio-api-dev      web service   api.dev.anystudio.ai
#   anystudio-worker-dev   worker        fast/heavy vendor work
#   anystudio-media-dev    worker        local ffmpeg/sharp work
#   anystudio-db-dev       postgres      private network only
#   anystudio-kv-dev       key value     private network only
#
# ONE FILE, ONE ENVIRONMENT, ONE BLUEPRINT
# ----------------------------------------
# This file owns development only. `render.staging.yaml` and
# `render.production.yaml` own their namesake resources. Import each path once;
# never point a second Blueprint at a resource an existing Blueprint manages.
#
# THE WORKER IS THE API IMAGE WITH A DIFFERENT COMMAND
# ----------------------------------------------------
# Same Dockerfile, `dockerCommand: node dist/src/worker/main.js`. The worker
# needs Redis for its queue but not for correctness: with Redis down it runs
# QUEUED rows straight from Postgres (see src/worker/supervisor.ts).
#
# DEPLOYS ARE NOT TRIGGERED HERE
# ------------------------------
# `autoDeployTrigger: off` on purpose. The `API` GitHub workflow deploys a commit
# only after it has passed the checks, pins that exact commit, waits for it
# to be live, and then proves through Cloudflare that the running process is
# the one it shipped. Turning service auto-deploy on would race that. Render's
# Blueprint Auto Sync is a separate dashboard setting and MUST also be No;
# otherwise a render.yaml push redeploys changed resources before CI passes.
#
# MIGRATIONS RUN ONCE PER DEPLOY
# ------------------------------
# `preDeployCommand` runs in the new image before any new instance starts.
# Never in the start command — two replicas booting together would both run
# `migrate deploy` against the same database, which is how a schema ends up
# half-applied. The seed follows the migrations: it is the reference data
# the app reads at runtime (plans, packs, credit costs, provider routing),
# every row an upsert, so a fresh database has something to sell and an old
# one picks up price changes. It also grants the first staff member when
# BOOTSTRAP_SUPERADMIN_EMAIL is set (docs/DEPLOY.md §11).
#
# ONE npm script, not `a && b`: Render does not run this line through a
# shell, so `&&` reaches npm as extra arguments to the first script — the
# migrations ran, the seed silently never did. npm runs a script's own body
# through a shell, so the chaining lives in package.json ("release").

previewsEnabled: false

databases:
  - name: anystudio-db-dev
    region: frankfurt # same region as the API: private network, one hop
    postgresMajorVersion: '18'
    plan: 0.1c-256mb # 0.1 CPU / 256 MB / 15 GB — the dev floor, ~$10.50/mo
    # Empty list = reachable only from Render services in this region. The
    # database that holds password hashes and the credit ledger gets no
    # public endpoint at all. To connect a GUI from your laptop, add your IP
    # here temporarily rather than opening it permanently.
    ipAllowList: []

services:
  # The queue. Free plan is fine for dev: a job is an id and a heartbeat.
  # Private only — nothing outside Render's network needs it.
  - type: keyvalue
    name: anystudio-kv-dev
    region: frankfurt
    plan: free
    ipAllowList: []
    # A queue is not a cache. Under the default allkeys-lru, a full instance
    # quietly throws away whichever keys it likes — which can be a queued
    # generation someone has already paid credits for. noeviction makes a
    # full instance refuse writes instead, which the API logs loudly and
    # the credits path treats as "not started, refunded".
    maxmemoryPolicy: noeviction

  - type: web
    name: anystudio-api-dev
    runtime: docker
    branch: development
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb # pre-deploy commands are not available on free instances
    numInstances: 1
    region: frankfurt # must match the database's region to reach it privately
    healthCheckPath: /health # liveness, not /ready — see health.controller.ts
    preDeployCommand: npm run release
    autoDeployTrigger: 'off'
    envVars:
      # Injected by Render, never typed by a human and never in this file.
      #
      # Both point at the direct connection today, which is correct while one
      # instance serves dev. When you scale past one instance, set
      # `connectionPool: pgbouncer` on the database above and change
      # DATABASE_URL alone to `connectionPoolString` — migrations must keep
      # using the direct string, because DDL and advisory locks do not survive
      # a transaction pooler. That split is why schema.prisma declares
      # `directUrl`.
      - key: DATABASE_URL
        fromDatabase: { name: anystudio-db-dev, property: connectionString }
      - key: DIRECT_URL
        fromDatabase: { name: anystudio-db-dev, property: connectionString }
      - key: REDIS_URL
        fromService:
          { type: keyvalue, name: anystudio-kv-dev, property: connectionString }
      - fromGroup: anystudio-dev
      - key: APP_ENV
        value: dev
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: api
      - key: PORT
        value: '3001'
      - key: LOG_LEVEL
        value: debug

  - type: worker
    name: anystudio-worker-dev
    runtime: docker
    branch: development
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: node dist/src/worker/main.js
    plan: 0.5c-512mb
    numInstances: 1
    # Render otherwise sends SIGKILL after 30 s, while vendor video/dub calls
    # routinely run for minutes. This is Render's maximum graceful window;
    # interrupted work beyond it is reclaimed by the generation sweeper.
    maxShutdownDelaySeconds: 300
    region: frankfurt
    autoDeployTrigger: 'off'
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: anystudio-db-dev, property: connectionString }
      - key: DIRECT_URL
        fromDatabase: { name: anystudio-db-dev, property: connectionString }
      - key: REDIS_URL
        fromService:
          { type: keyvalue, name: anystudio-kv-dev, property: connectionString }
      - fromGroup: anystudio-dev
      - key: APP_ENV
        value: dev
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: worker
      - key: LOG_LEVEL
        value: debug
      # V8 sizes its heap from the HOST's memory, not the container's, so on
      # a 512 MB starter it never feels pressure — the cgroup kills the
      # process while the garbage collector still thinks it has room. This is
      # the number that turns an OOM kill into a collection.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # Concurrency per weight class.
      #
      # A "heavy" slot was called cheap because it is mostly a socket waiting
      # on a vendor — true for the middle of the job and wrong for the end of
      # it, which is when the finished file is pulled into memory whole,
      # written to R2, written to a temp file and passed through ffmpeg for a
      # thumbnail. A 10 MB clip is 20-30 MB live at that moment, and eight of
      # them can reach it together. Six plus eight plus two is fourteen jobs
      # in 512 MB; these numbers are what fits.
      #
      # Raise them with the instance, not before. Six/eight fits this worker
      # because the local queue now runs on the separate 2 GB service below.
      #
      # The dedicated media service below owns media.local, so this process
      # only waits on vendors and handles fast work. Keep this split explicit:
      # an unset WORKER_QUEUES means all queues and would silently put stitches
      # back onto this 512 MB instance.
      - key: WORKER_FAST_CONCURRENCY
        value: '6'
      - key: WORKER_HEAVY_CONCURRENCY
        value: '8'
      - key: WORKER_QUEUES
        value: media.fast,media.heavy
      # How many ffmpeg processes may exist AT ONCE, across every queue.
      #
      # The queue concurrencies cannot answer this: an ad's four thumbnails
      # are four jobs on media.heavy and the stitch is one on media.local, so
      # three slots produced five simultaneous ffmpegs. Measured on a
      # four-shot ad: 344 MB of ffmpeg together, 258 MB one at a time — and
      # serialised was not slower, because half a CPU was the real limit all
      # along. Raise it on a box with cores to spare.
      - key: FFMPEG_CONCURRENCY
        value: '1'
      # For every environment, deploy this same image TWICE and split the
      # queues, because the three queues are not the same kind of work:
      #
      #   anystudio-worker-<env>   WORKER_QUEUES=media.fast,media.heavy
      #                            0.5c-512mb is fine — these are sockets waiting
      #                            on a vendor. Put the concurrency back up
      #                            (6 / 8): it was only ever lowered to make
      #                            room for ffmpeg.
      #
      #   anystudio-media-<env>    WORKER_QUEUES=media.local
      #                            1c-2g. A 30-second stitch peaks
      #                            in the hundreds of megabytes, and ffmpeg is
      #                            a CHILD process — its memory is invisible
      #                            to the Node heartbeat, so the first sign of
      #                            trouble is the whole instance restarting
      #                            and taking every generation in flight with
      #                            it. On its own service it takes only its
      #                            own ad, which the sweeper then refunds.
      #
      # Same image, same command, one env var apart.

  # ---------------------------------------------------------------- media
  # The same image, the same command, serving only media.local.
  #
  # WHY IT IS ITS OWN SERVICE
  # An ad's four shots each grab a video thumbnail as they land (an ffmpeg
  # apiece, ~80 MB), and the stitch starts on top of them (~260 MB at 720p).
  # Measured together on a four-shot ad that is 344 MB of ffmpeg beside
  # Node's 182 — 526 on a 512 MB starter, which is exactly the OOM that
  # refunded four ads in a day. FFMPEG_CONCURRENCY caps the count; this caps
  # the blast radius. On its own service a stitch that still overruns takes
  # its own ad and nothing else, and the sweeper refunds that one.
  #
  # It also frees the worker: its concurrencies were cut to make room for an
  # encoder that no longer lives there, so put them back.
  #
  # NO preDeployCommand. Migrations belong to the API alone — two services
  # running `migrate deploy` against one database is how a schema ends up
  # half-applied (see the note at the top of this file).
  #
  # Set RENDER_MEDIA_SERVICE_ID on the environment or the API workflow will
  # never deploy it, and it will answer forever on the image it was born with.
  - type: worker
    name: anystudio-media-dev
    runtime: docker
    branch: development
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: node dist/src/worker/main.js
    plan: 1c-2g
    numInstances: 1
    # Let an active stitch finish during deploy instead of killing ffmpeg at
    # Render's 30-second default.
    maxShutdownDelaySeconds: 300
    region: frankfurt
    autoDeployTrigger: 'off'
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: anystudio-db-dev, property: connectionString }
      - key: DIRECT_URL
        fromDatabase: { name: anystudio-db-dev, property: connectionString }
      - key: REDIS_URL
        fromService:
          { type: keyvalue, name: anystudio-kv-dev, property: connectionString }
      - fromGroup: anystudio-dev
      - key: APP_ENV
        value: dev
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: media
      - key: LOG_LEVEL
        value: debug
      # 2 GB, so the heap can have more than a starter's share.
      - key: NODE_OPTIONS
        value: --max-old-space-size=1024
      # Only the encoder's queue. The other two are the worker's.
      - key: WORKER_QUEUES
        value: media.local
      - key: WORKER_LOCAL_CONCURRENCY
        value: '1'
      # Redis-down fallback follows the same local-only boundary and must not
      # buffer two large stitches in one process while ffmpeg serialises them.
      - key: WORKER_DIRECT_CONCURRENCY
        value: '1'
      - key: FFMPEG_CONCURRENCY
        value: '1'

# `anystudio-dev` is intentionally NOT declared under envVarGroups here.
# Render does not support `sync: false` inside a Blueprint-managed environment
# group: it silently ignores those variables. Create and populate the group in
# the Dashboard before the first Blueprint sync (docs/DEPLOY.md §3), then the
# three `fromGroup` references above attach that one manually managed secret
# source to the API and both workers.
