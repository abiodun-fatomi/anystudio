services:
  # ---------------------------------------------------------------- development
  - type: web
    name: anystudio-api-dev
    runtime: docker
    branch: development
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter               # pre-deploy commands are not available on free instances
    region: frankfurt           # closest Render region to Lagos and to Europe
    healthCheckPath: /health    # liveness, not /ready — see health.controller.ts
    preDeployCommand: npm run db:deploy
    autoDeploy: false
    envVars:
      - fromGroup: anystudio-dev
      - key: APP_ENV
        value: dev
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: api
      - key: PORT
        value: "3001"
      - key: LOG_LEVEL
        value: debug
      - key: REDIS_URL
        fromService: { type: redis, name: anystudio-redis-dev, property: connectionString }

  - type: worker
    name: anystudio-worker-dev
    runtime: docker
    branch: development
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    autoDeploy: false
    envVars:
      - fromGroup: anystudio-dev
      - key: APP_ENV
        value: dev
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: worker
      - key: LOG_LEVEL
        value: debug
      - key: REDIS_URL
        fromService: { type: redis, name: anystudio-redis-dev, property: connectionString }

  - type: redis
    name: anystudio-redis-dev
    plan: free
    region: frankfurt
    # BullMQ jobs must survive a restart — a dropped queue is a customer whose
    # credits were spent on a generation that never came back.
    maxmemoryPolicy: noeviction
    ipAllowList: []             # private network only

  # -------------------------------------------------------------------- staging
  - type: web
    name: anystudio-api-staging
    runtime: docker
    branch: staging
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    preDeployCommand: npm run db:deploy
    autoDeploy: false
    envVars:
      - fromGroup: anystudio-staging
      - key: APP_ENV
        value: staging
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: api
      - key: PORT
        value: "3001"
      - key: LOG_LEVEL
        value: info
      - key: REDIS_URL
        fromService: { type: redis, name: anystudio-redis-staging, property: connectionString }

  - type: worker
    name: anystudio-worker-staging
    runtime: docker
    branch: staging
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    autoDeploy: false
    envVars:
      - fromGroup: anystudio-staging
      - key: APP_ENV
        value: staging
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: worker
      - key: LOG_LEVEL
        value: info
      - key: REDIS_URL
        fromService: { type: redis, name: anystudio-redis-staging, property: connectionString }

  - type: redis
    name: anystudio-redis-staging
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # ----------------------------------------------------------------- production
  - type: web
    name: anystudio-api
    runtime: docker
    branch: production
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    preDeployCommand: npm run db:deploy
    autoDeploy: false
    envVars:
      - fromGroup: anystudio-production
      - key: APP_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: api
      - key: PORT
        value: "3001"
      - key: LOG_LEVEL
        value: info
      - key: REDIS_URL
        fromService: { type: redis, name: anystudio-redis, property: connectionString }

  - type: worker
    name: anystudio-worker
    runtime: docker
    branch: production
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    autoDeploy: false
    envVars:
      - fromGroup: anystudio-production
      - key: APP_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: worker
      - key: LOG_LEVEL
        value: info
      - key: REDIS_URL
        fromService: { type: redis, name: anystudio-redis, property: connectionString }

  - type: redis
    name: anystudio-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []
