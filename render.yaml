# Render blueprint — the development environment.
#
# Import it once (Render → New → Blueprint → this repo, branch `development`)
# and it creates four billable things: the API, the worker, Postgres and the
# Redis (Key Value) the queue rides on.
#
#   anystudio-api-dev      web service   api.dev.anystudio.ai
#   anystudio-worker-dev   worker        no HTTP; the queue consumer
#   anystudio-db-dev       postgres      private network only
#   anystudio-kv-dev       key value     private network only
#
# WHY ONLY DEV
# ------------
# A blueprint creates everything it declares the moment it is synced, and an
# idle service bills exactly like a busy one. Staging and production do not
# exist yet — by the branch flow in docs/DEPLOY.md they are weeks away.
#
# THE WORKER IS THE API IMAGE WITH A DIFFERENT COMMAND
# ----------------------------------------------------
# Same Dockerfile, `dockerCommand: node dist/src/worker/main.js`. The worker
# needs Redis for its queue but not for correctness: with Redis down it runs
# QUEUED rows straight from Postgres (see src/worker/supervisor.ts).
#
# What to add, and when:
#   first promotion to staging     → copy the dev blocks, s/-dev/-staging/,
#                                    branch: staging, APP_ENV: staging
#   first production release       → same again, and turn on
#                                    highAvailability + a real disk size
#
# DEPLOYS ARE NOT TRIGGERED HERE
# ------------------------------
# `autoDeploy: false` on purpose. The `API` GitHub workflow deploys a commit
# only after it has passed the checks, pins that exact commit, waits for it
# to be live, and then proves through Cloudflare that the running process is
# the one it shipped. Turning auto-deploy on would race that.
#
# MIGRATIONS RUN ONCE PER DEPLOY
# ------------------------------
# `preDeployCommand` runs in the new image before any new instance starts.
# Never in the start command — two replicas booting together would both run
# `migrate deploy` against the same database, which is how a schema ends up
# half-applied.

previewsEnabled: false

databases:
  - name: anystudio-db-dev
    region: frankfurt            # same region as the API: private network, one hop
    postgresMajorVersion: "18"
    plan: 0.1c-256mb             # 0.1 CPU / 256 MB / 15 GB — the dev floor, ~$10.50/mo
    # Empty list = reachable only from Render services in this region. The
    # database that holds password hashes and the credit ledger gets no
    # public endpoint at all. To connect a GUI from your laptop, add your IP
    # here temporarily rather than opening it permanently.
    ipAllowList: []

services:
  # The queue. Free plan is fine for dev: a job is an id and a heartbeat.
  # Private only — nothing outside Render's network needs it.
  - type: keyvalue
    name: anystudio-kv-dev
    region: frankfurt
    plan: free
    ipAllowList: []

  - type: web
    name: anystudio-api-dev
    runtime: docker
    branch: development
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter                # pre-deploy commands are not available on free instances
    region: frankfurt            # must match the database's region to reach it privately
    healthCheckPath: /health     # liveness, not /ready — see health.controller.ts
    preDeployCommand: npm run db:deploy
    autoDeploy: false
    envVars:
      # Injected by Render, never typed by a human and never in this file.
      #
      # Both point at the direct connection today, which is correct while one
      # instance serves dev. When you scale past one instance, set
      # `connectionPool: pgbouncer` on the database above and change
      # DATABASE_URL alone to `connectionPoolString` — migrations must keep
      # using the direct string, because DDL and advisory locks do not survive
      # a transaction pooler. That split is why schema.prisma declares
      # `directUrl`.
      - key: DATABASE_URL
        fromDatabase: { name: anystudio-db-dev, property: connectionString }
      - key: DIRECT_URL
        fromDatabase: { name: anystudio-db-dev, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: anystudio-kv-dev, property: connectionString }
      - fromGroup: anystudio-dev
      - key: APP_ENV
        value: dev
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: api
      - key: PORT
        value: "3001"
      - key: LOG_LEVEL
        value: debug

  - type: worker
    name: anystudio-worker-dev
    runtime: docker
    branch: development
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: node dist/src/worker/main.js
    plan: starter
    region: frankfurt
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: anystudio-db-dev, property: connectionString }
      - key: DIRECT_URL
        fromDatabase: { name: anystudio-db-dev, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: anystudio-kv-dev, property: connectionString }
      - fromGroup: anystudio-dev
      - key: APP_ENV
        value: dev
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: worker
      - key: LOG_LEVEL
        value: debug
      # Concurrency per weight class. Video holds a slot for minutes.
      - key: WORKER_FAST_CONCURRENCY
        value: "6"
      - key: WORKER_HEAVY_CONCURRENCY
        value: "2"

envVarGroups:
  # Render prompts for each of these on first sync and stores them in the
  # dashboard. They are `sync: false` so no value ever lives in this file.
  # The group is shared by every dev service, so the worker inherits it
  # unchanged when it arrives.
  - name: anystudio-dev
    envVars:
      - key: APP_KEY                    # openssl rand -base64 32 — encrypts TOTP seeds and the Google handshake cookie
        sync: false
      - key: ORIGIN_APP                 # https://app.dev.anystudio.ai
        sync: false
      - key: ORIGIN_ORG                 # https://org.dev.anystudio.ai
        sync: false
      - key: ORIGIN_ADMIN               # https://admin.dev.anystudio.ai
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM                  # "AnyStudio <hello@anystudio.ai>"
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # ---- AI providers: see docs/PROVIDERS.md for where each comes from ----
      - key: FAL_KEY
        sync: false
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: PHOTOROOM_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BFL_API_KEY
        sync: false
      - key: HIGGSFIELD_API_KEY
        sync: false
      - key: HIGGSFIELD_API_SECRET
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
