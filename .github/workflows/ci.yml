name: CI

on:
  push:
    branches: [development, staging, production]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anystudio
          POSTGRES_PASSWORD: anystudio
          POSTGRES_DB: anystudio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anystudio" --health-interval 5s
          --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 12

    # Fixtures, not secrets. The Postgres and Redis they point at are service
    # containers on the runner's own loopback interface that are destroyed with
    # the job, and GitHub prints a step's env verbatim — so nothing that unlocks
    # anything may be written here. Real credentials go in repository secrets,
    # which GitHub masks in logs.
    env:
      DATABASE_URL: postgresql://anystudio:anystudio@localhost:5432/anystudio_test?schema=public
      # A SEPARATE database for the drift check.
      #
      # `migrate diff --from-migrations` replays every migration into the
      # shadow database to work out what the schema should look like, and
      # leaves it there. Point it at DATABASE_URL and the next step —
      # `db:deploy` — finds a database that already has tables but no
      # _prisma_migrations rows, and refuses with P3005 "the database schema
      # is not empty". The check and the thing it checks need separate ground.
      SHADOW_DATABASE_URL: postgresql://anystudio:anystudio@localhost:5432/anystudio_shadow?schema=public
      REDIS_URL: redis://localhost:6379
      ORIGIN_APP: http://localhost:3000
      ORIGIN_ORG: http://localhost:3002
      ORIGIN_ADMIN: http://localhost:3003

    steps:
      - uses: actions/checkout@v4
      # No version here on purpose: it is read from package.json's
      # packageManager field. Giving both is ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # Generated per run rather than written above, so no key-shaped literal
      # ever exists in this file or in a build log. APP_KEY encrypts TOTP seeds
      # at rest; a fresh one each run is exactly right for a throwaway database.
      - name: Generate a throwaway APP_KEY
        run: echo "APP_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      # Before lint and typecheck, never after: every app imports the generated
      # client, so without this the failures point at the wrong place.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Create the shadow database
        run: PGPASSWORD=anystudio psql -h localhost -U anystudio -d anystudio_test -c 'CREATE DATABASE anystudio_shadow'

      # Catches a schema edited without a matching migration — the change that
      # works locally and fails on deploy.
      - name: Migrations match the schema
        run: |
          pnpm --filter @anystudio/db exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:deploy
      - run: pnpm db:seed
        env: { SEED_ENV: dev }
      - run: pnpm test
      - run: pnpm build

  images:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix: { app: [api, worker] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
